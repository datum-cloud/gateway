name: Forward proxy POC

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forward-proxy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      RUN_ID: fp-${{ github.run_id }}-${{ github.run_attempt }}-e2e
      K8S_VERSION: v1.32.0
      KIND_VERSION: v0.30.0
      DOCKER_CONTEXT: default
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Set absolute per-run artifact paths
        run: |
          printf 'ARTIFACT_DIR=%s/forward-proxy-%s/raw\n' "$RUNNER_TEMP" "$RUN_ID" >> "$GITHUB_ENV"
          printf 'SANITIZED_ARTIFACT_DIR=%s/forward-proxy-%s/sanitized\n' "$RUNNER_TEMP" "$RUN_ID" >> "$GITHUB_ENV"

      - name: Checkout exact candidate
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify checkout provenance
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'

      - name: Runtime and CI fast checks
        timeout-minutes: 3
        run: |
          python -m unittest discover -s prototype/forward-proxy/tests/unit
          python -m unittest discover -s prototype/forward-proxy/ci -p 'test_*.py'
          python -m unittest discover -s prototype/forward-proxy/e2e -p 'test_*.py'
          python -m compileall -q prototype/forward-proxy/runtime prototype/forward-proxy/tests/unit prototype/forward-proxy/ci prototype/forward-proxy/e2e

      - name: Install pinned cluster tools
        timeout-minutes: 8
        run: bash prototype/forward-proxy/ci/install-tools.sh

      - name: Use Docker's classic image store before building or loading
        timeout-minutes: 2
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/docker
          cfg='{}'
          if sudo test -s /etc/docker/daemon.json; then cfg=$(sudo cat /etc/docker/daemon.json); fi
          echo "$cfg" | jq '.features["containerd-snapshotter"] = false' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker
          docker info --format 'Docker storage: {{ .Driver }} {{ .DriverStatus }}'
          if docker info --format '{{ .DriverStatus }}' | grep -q io.containerd.snapshotter; then
            echo 'The containerd image store is still enabled' >&2
            exit 1
          fi

      - name: Build candidate and run actual KIND E2E
        id: e2e
        run: |
          mkdir -p "$ARTIFACT_DIR"
          timeout --signal=TERM --kill-after=30s 25m bash prototype/forward-proxy/e2e/run.sh

      - name: Independently clean up even after partial bootstrap
        id: cleanup
        if: ${{ always() }}
        run: timeout --signal=TERM --kill-after=15s 3m bash prototype/forward-proxy/e2e/cleanup.sh

      - name: Validate results and reconstruct sanitized artifacts
        if: ${{ always() }}
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: python3 prototype/forward-proxy/ci/sanitize-results.py

      - name: Upload only sanitized reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forward-proxy-${{ github.run_id }}-${{ github.run_attempt }}-e2e
          path: |
            ${{ env.SANITIZED_ARTIFACT_DIR }}/provenance.json
            ${{ env.SANITIZED_ARTIFACT_DIR }}/results.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
